<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Game Closet - Collection</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">

    <style>
        body {
            background: linear-gradient(135deg, #0f0c29, #302b63, #24243e);
            color: #fff;
            min-height: 100vh;
            font-family: 'Segoe UI', sans-serif;
        }

        .background {
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            background: url('https://source.unsplash.com/random/1920x1080/?gaming,neon') no-repeat center center/cover;
            opacity: 0.15;
            z-index: -1;
            animation: slowPan 60s linear infinite;
        }

        @keyframes slowPan {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        .card {
            background: rgba(255, 255, 255, 0.08);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            transition: all 0.4s ease;
        }

        .card:hover {
            transform: translateY(-12px) scale(1.03);
            box-shadow: 0 20px 40px rgba(0, 255, 150, 0.2);
            border-color: #00ff96;
        }

        .btn-success {
            background: linear-gradient(45deg, #00ff96, #00cc77);
            border: none;
            transition: all 0.3s;
        }
        .btn-success:hover {
            transform: translateY(-3px);
            box-shadow: 0 10px 20px rgba(0, 255, 150, 0.4);
        }

        h1 {
            text-shadow: 0 0 20px rgba(0, 255, 150, 0.5);
        }

        .game-title {
            color: #00ff96;
        }
    </style>
</head>
<body>
<div class="background"></div>

<div class="container mt-5">
    <div class="d-flex justify-content-between align-items-center mb-5">
        <h1 class="display-4 fw-bold">🎮 Game Closet</h1>
        <div>
            <span class="badge bg-success fs-5 px-3 py-2" th:text="'Total: ' + ${totalGames} + ' Games'"></span>
            <a href="/games/new" class="btn btn-success btn-lg ms-4">
                <i class="fas fa-plus"></i> Add New Game
            </a>
        </div>
    </div>

    <div class="row row-cols-1 row-cols-md-2 row-cols-lg-3 g-4">
        <div class="col" th:each="game : ${games}">
            <div class="card h-100 text-white">
                <div class="card-body">
                    <h5 class="card-title game-title fw-bold" th:text="${game.title}"></h5>
                    <p class="card-text">
                        <strong>Platform:</strong> <span th:text="${game.platform}"></span><br>
                        <strong>Genre:</strong> <span th:text="${game.genre}"></span><br>
                        <strong>Year:</strong> <span th:text="${game.releaseYear}"></span><br>
                        <strong>Condition:</strong> <span th:text="${game.condition}"></span>
                    </p>
                    <h4 class="text-success fw-bold" th:text="'€ ' + ${game.price}"></h4>
                </div>
                <div class="card-footer bg-transparent border-0">
                    <a th:href="@{/games/delete/{id}(id=${game.id})}"
                       class="btn btn-outline-danger btn-sm"
                       onclick="return confirm('Delete this game?')">
                        <i class="fas fa-trash"></i> Delete
                    </a>
                </div>
            </div>
        </div>
    </div>

    <div th:if="${games.isEmpty()}" class="text-center mt-5 py-5">
        <h2>Your collection is empty...</h2>
        < class="lead">Start building your Game Closet now! </p>
        <a href="/games/new" class="btn btn-success btn-lg mt-3">
            <i class="fas fa-plus"></i> Add Your First Game
        </a>
    </div>
</div>
</body>
</html>

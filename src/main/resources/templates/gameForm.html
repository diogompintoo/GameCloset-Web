<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Add New Game - Game Closet</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">

  <style>
    body {
      background: linear-gradient(135deg, #0f0c29, #302b63, #24243e);
      color: #fff;
      min-height: 100vh;
      font-family: 'Segoe UI', sans-serif;
    }

    .background {
      position: fixed;
      top: 0; left: 0;
      width: 100%; height: 100%;
      background: url('https://source.unsplash.com/random/1920x1080/?gaming,neon') no-repeat center center/cover;
      opacity: 0.12;
      z-index: -1;
      animation: slowPan 80s linear infinite;
    }

    @keyframes slowPan {
      0% { background-position: 0% 50%; }
      50% { background-position: 100% 50%; }
      100% { background-position: 0% 50%; }
    }

    .form-container {
      background: rgba(255, 255, 255, 0.08);
      backdrop-filter: blur(12px);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 16px;
      padding: 2.5rem;
      box-shadow: 0 15px 35px rgba(0, 0, 0, 0.4);
    }

    .form-control, .form-select {
      background-color: rgba(255, 255, 255, 0.1);
      border: 1px solid rgba(255, 255, 255, 0.2);
      color: #fff;
    }

    .form-control:focus, .form-select:focus {
      background-color: rgba(255, 255, 255, 0.15);
      border-color: #00ff96;
      box-shadow: 0 0 0 0.3rem rgba(0, 255, 150, 0.25);
      color: #fff;
    }

    label {
      color: #ddd;
      font-weight: 500;
    }

    .btn-success {
      background: linear-gradient(45deg, #00ff96, #00cc77);
      border: none;
      padding: 12px 30px;
      font-weight: bold;
      transition: all 0.3s;
    }
    .btn-success:hover {
      transform: translateY(-4px);
      box-shadow: 0 12px 25px rgba(0, 255, 150, 0.4);
    }

    h2 {
      text-shadow: 0 0 15px rgba(0, 255, 150, 0.6);
    }
  </style>
</head>
<body>
<div class="background"></div>

<div class="container mt-5">
  <div class="row justify-content-center">
    <div class="col-lg-6">
      <div class="form-container">
        <div class="text-center mb-4">
          <h2>🎮 Add New Game</h2>
          <p class="text-muted">Add to your collection</p>
        </div>

        <form th:action="@{/games}" method="post" th:object="${game}">
          <div class="mb-3">
            <label class="form-label">Game Title</label>
            <input type="text" class="form-control" th:field="*{title}" required>
          </div>

          <div class="mb-3">
            <label class="form-label">Genre</label>
            <input type="text" class="form-control" th:field="*{genre}">
          </div>

          <div class="mb-3">
            <label class="form-label">Platform</label>
            <input type="text" class="form-control" th:field="*{platform}" required>
          </div>

          <div class="mb-3">
            <label class="form-label">Release Year</label>
            <input type="number" class="form-control" th:field="*{releaseYear}" min="1970" max="2030">
          </div>

          <div class="mb-3">
            <label class="form-label">Condition</label>
            <select class="form-select" th:field="*{condition}">
              <option value="New">New</option>
              <option value="Good">Good</option>
              <option value="Used">Used</option>
              <option value="Damaged">Damaged</option>
            </select>
          </div>

          <div class="mb-4">
            <label class="form-label">Price (€)</label>
            <input type="number" step="0.01" class="form-control" th:field="*{price}" required>
          </div>

          <div class="d-grid gap-2 d-md-flex justify-content-md-end">
            <a href="/" class="btn btn-secondary me-md-2">Cancel</a>
            <button type="submit" class="btn btn-success">
              <i class="fas fa-save"></i> Save Game
            </button>
          </div>
        </form>
      </div>
    </div>
  </div>
</div>
</body>
</html>
